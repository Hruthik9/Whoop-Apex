<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A2421" />
      <stop offset="100%" stop-color="#0B0C0E" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F076" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" stroke="#00F076" stroke-opacity="0.3" stroke-width="6" />
  <!-- Center Pulse Ring -->
  <circle cx="256" cy="225" r="130" fill="none" stroke="url(#ringGrad)" stroke-width="16" stroke-dasharray="750 60" filter="url(#neonGlow)" />
  <!-- Pulse Waveform -->
  <path d="M 140 225 L 195 225 L 225 150 L 256 310 L 287 180 L 315 225 L 372 225" fill="none" stroke="#00F076" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />
  <!-- Brand Apex Typography -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Inter', sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="4" text-anchor="middle">APEX</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Depth Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#141822" />
      <stop offset="55%" stop-color="#0B0D12" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>
    
    <radialGradient id="ambientCyan" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#00F076" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#00D2FF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Master Apex Ribbon Gradient: Electric Emerald to Cyber Cyan to Royal Cobalt -->
    <linearGradient id="apexGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F076" />
      <stop offset="48%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Secondary Accent Gradient: Hyper Pulse Core -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F076" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A3447" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00F076" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1A202C" stop-opacity="0.4" />
    </linearGradient>

    <!-- Ultra-Crisp Drop Shadow & Soft Bloom Filters -->
    <filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" opacity="0.35" />
        <feMergeNode in="blur2" opacity="0.5" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base App Canvas: Premium Obsidian with Subtle Luminous Perimeter -->
  <rect width="512" height="512" rx="116" fill="url(#bgGlow)" />
  <rect width="508" height="508" x="2" y="2" rx="114" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Ambient Internal Bloom -->
  <circle cx="256" cy="240" r="180" fill="url(#ambientCyan)" />

  <!-- The Apex Emblem: Precision Monolithic Upward Peak with Biometric Pulse Notch -->
  <!-- Top-Level Apex Chevron (Bold, Aerodynamic, Unmistakable Silhouette) -->
  <g filter="url(#softShadow)">
    <!-- Primary Outer Apex Pinnacle -->
    <path d="M 256 92
             L 394 362
             C 400 374, 391 388, 377 388
             L 326 388
             C 317 388, 309 382, 305 374
             L 256 270
             L 207 374
             C 203 382, 195 388, 186 388
             L 135 388
             C 121 388, 112 374, 118 362
             Z"
          fill="url(#apexGrad)" 
          filter="url(#iconGlow)" />

    <!-- Center Kinetic Hypertrophy & Heartbeat Core Diamond -->
    <!-- Represents the fusion of AI intelligence and cardiovascular apex -->
    <path d="M 256 182
             L 294 256
             L 256 292
             L 218 256
             Z"
          fill="#080A0F"
          stroke="#00F076"
          stroke-width="5"
          stroke-linejoin="round" />

    <polygon points="256,206 280,256 256,278 232,256" fill="url(#pulseGrad)" />
  </g>
</svg>
